# Render Blueprint for the FastAPI backend. Secrets are entered in the Render dashboard (sync: false).
services:
  - type: web
    name: ban-nha-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    region: singapore
    plan: free # free instances sleep after ~15 min idle; upgrade to "starter" for production
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: CORS_ORIGINS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ACCOUNT_EMAIL_DOMAIN
        value: bannha.internal
      - key: TIMEZONE
        value: Asia/Ho_Chi_Minh
