[project]
name = "ban-nha-backend"
version = "0.1.0"
description = "BẢN NHÀ API — FastAPI backend for the boarding-school app"
requires-python = ">=3.13"
dependencies = [
    "asyncpg>=0.32.0",
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "pydantic-settings>=2.16.3",
    "pyjwt[crypto]>=2.15.1",
    "sqlalchemy[asyncio]>=2.1.9",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "S", "ASYNC", "RUF", "SIM", "PT", "T20"]
ignore = ["RUF001", "RUF002", "RUF003"]  # Vietnamese text legitimately uses look-alike characters

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"tests/db/**" = ["S101", "E501"]  # long SQL literals read better unwrapped

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["db: needs the local Supabase stack (npx supabase start)"]
addopts = "-q"

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
